services:
  garagelog:
    image: ghcr.io/philipusgood/garagelog:latest
    container_name: garagelog
    ports:
      - "5002:5002"
    volumes:
      # Persists the database and all uploaded documents
      - /mnt/user/appdata/garagelog:/data
    environment:
      - NODE_ENV=production
      - DATA_DIR=/data
      - PORT=5002

      # ── Auth — values come from .env (see .env.example) ──────────────────
      - JWT_SECRET=${JWT_SECRET}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}

      # COOKIE_SECURE: set to "true" if the app is served over HTTPS (recommended).
      # - COOKIE_SECURE=true

    restart: unless-stopped
